name: quran_app
description: Aplikasi Al-Qur'an (daftar surah, juz, halaman, dan ayat acak) berbasis Flutter dengan data dari MyQuran API v3.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  google_fonts: 6.3.3
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
